apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - postgres.yaml
  - deployment.yaml

# ConfigMap generator for knowledge base (auto-updates on file changes)
configMapGenerator:
  - name: vishal-agent-knowledge-base
    files:
      - ../knowledge_base/example.txt
    options:
      disableNameSuffixHash: false  # Enable hash suffix for auto-reload

# Secret generator (use sealed-secrets or external-secrets in production)
secretGenerator:
  - name: vishal-agent-secrets
    literals:
      - DATABASE_URL=postgresql+asyncpg://vishal_agent:vishal_agent_secret@postgres-service:5432/vishal_agent_sessions
      - OLLAMA_API_BASE=http://YOUR_MACBOOK_M1_IP:11434

# Images to use
images:
  - name: ghcr.io/vishal-pandey/vishal_agent
    newTag: latest

# Common labels
commonLabels:
  app.kubernetes.io/name: vishal-agent
  app.kubernetes.io/part-of: portfolio-ai

# Annotations
commonAnnotations:
  managed-by: argocd
